location = /chat {
    return 308 /chat/;
}

location ^~ /chat/api/ {
    proxy_pass http://127.0.0.1:3001/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # 必须大于应用层上传上限（backend/src/upload.ts 的 UPLOAD_BODY_LIMIT = 11 MiB）。
    # 若这里小于 11 MiB，超过该值的上传会先在 nginx 被 413，响应体不是本契约的
    # {error:{code:'UPLOAD_TOO_LARGE',...}} 形状，前端无法区分「被反代掐断」与「业务拒绝」。
    # 留 1 MiB 余量把判定权交给应用层。JSON 接口应用层仍有 32 KiB bodyLimit。
    client_max_body_size 12m;
    proxy_read_timeout 60s;
    access_log off;
}

location = /chat/ws {
    proxy_pass http://127.0.0.1:3001/ws;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    access_log off;
}

location ^~ /chat/assets/ {
    root /opt/aitrance/current/web;
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    expires 7d;
}

location ^~ /chat/ {
    root /opt/aitrance/current/web;
    index index.html;
    try_files $uri $uri/ /chat/index.html;
    # CSP 必须下发在**文档**上才有防护效果：后端只给 API/JSON 响应加 CSP，
    # 而 HTML 由 nginx 提供，所以这几条 add_header 是 SEC-04 在生产形态下真正生效的一环。
    # 取值与 backend/src/app.ts 的 CONTENT_SECURITY_POLICY / PERMISSIONS_POLICY 逐字一致；
    # backend/test/deploy-headers.test.ts 会做逐字漂移检测，改一边忘改另一边会红。
    # 已用真 Chrome（playwright channel:'chrome' 155）加载 frontend/dist 生产构建实测：
    # style/script/img/connect 违规均为 0（Vue :style 走 CSSOM；zod v4 的 `Function('')`
    # JIT 探测曾产生 1 条 script-src 违规，已由前端 z.config({jitless:true}) 消除），
    # 无失败请求，头像/弹层样式正常。实测日志：backend/evidence/csp-browser-check.log。
    # 注意：不要在 server 级或其它 location 写任何 add_header，否则本 location 的头会全部失效（nginx 继承规则）。
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ws: wss:" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Cache-Control no-cache always;
}

# =============================================================================
# aitrance-chat —— HTTPS（TLS 由 nginx 终结）完整站点配置
#
# 与同目录 nginx-chat.conf 的区别：
#   nginx-chat.conf        = 只含 location 的**片段**，塞进已有 server 块（HTTP 现状形态）。
#   nginx-chat-https.conf  = 本文件，**完整 server 块**，作为 sites-available 独立站点文件使用。
#
# 当前状态：**代码与配置已就绪，尚未部署**。SEC-01 结论为 BLOCK，阻断项三项，缺一不可：
#   1) 证书与私钥：/etc/letsencrypt/live/<DOMAIN>/fullchain.pem 与 privkey.pem
#      （或运维持有的商业证书，替换 ssl_certificate / ssl_certificate_key 两行）
#   2) DNS：<DOMAIN> 与 www.<DOMAIN> 的 A/AAAA 记录指向本机
#   3) 运维审批：开放 443、放行 80（仅用于 ACME 签发与跳转）
# 在拿到上述材料前，继续使用 HTTP 形态；本文件不会被加载。
#
# 安装（root，属运维操作，本任务不执行）：
#   sed -i 's/DOMAIN/mikuyun.xyz/g' nginx-chat-https.conf
#   cp nginx-chat-https.conf /etc/nginx/sites-available/aitrance-chat-https
#   ln -s /etc/nginx/sites-available/aitrance-chat-https /etc/nginx/sites-enabled/
#   从 sites-enabled 移除旧的 HTTP 站点 → nginx -t → systemctl reload nginx
#
# 配套后端环境变量（chat.env）：
#   TRUST_LOOPBACK_PROXY=true   # 信任本机 nginx 的 X-Forwarded-Proto
#   REQUIRE_HTTPS=true          # proxy→backend 段是明文，必须显式要求 https，否则 register/login 不会被拦
#   不要设置 TLS_CERT_PATH / TLS_KEY_PATH：本形态由 nginx 终结 TLS，后端保持 http 监听 127.0.0.1。
#
# 安全头注意事项（nginx 陷阱）：add_header 只在「当前层级没有 add_header 时」才从上层继承，
# 所以下面每个 location 都把自己的头写全，不能指望 server 级继承。
# =============================================================================

# ---------------------------------------------------------------------------
# 明文入口：只做「ACME 校验 + 301 跳转」，不放行任何业务请求。
# ---------------------------------------------------------------------------
server {
    listen 80;
    # 若主机未启用 IPv6，`listen [::]:80` 会让 nginx 启动失败，按需放开：
    # listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
        add_header Cache-Control no-store always;
    }

    # 其余全部 301；用 $request_uri 保留原始路径与查询串（子路径部署 /chat/... 不能丢前缀）。
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 加密入口
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    # 新版 nginx（>=1.25.1）推荐 `listen 443 ssl;` + `http2 on;`；这里选旧写法以兼容老版本
    # （新版本只会打 deprecation warning，不会启动失败）。升级 nginx 后可改成新写法。
    # listen [::]:443 ssl http2;
    server_name DOMAIN www.DOMAIN;

    # ---- 证书（运维提供）----
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP stapling 需要 resolver；未确认本机 DNS 配置前不要开启，否则 reload 可能失败。
    # resolver 127.0.0.53 valid=300s;
    # ssl_stapling on;
    # ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- 精确 Origin 白名单（浏览器侧第一道闸；后端 CORS 是第二道）----
    # nginx 的 if 不能嵌套，用「先置位、最后统一判定」的平铺写法。
    # $http_origin 为空（curl / 同源导航 / 非浏览器客户端）放行；
    # 一旦带了 Origin，必须与下面字面值完全相等（含协议与端口），否则 403。
    set $allowed_origin "";
    if ($http_origin = "") { set $allowed_origin "absent"; }
    if ($http_origin = "https://DOMAIN") { set $allowed_origin "matched"; }
    if ($http_origin = "https://www.DOMAIN") { set $allowed_origin "matched"; }
    if ($allowed_origin = "") { return 403; }

    # ---- REST：/chat/api/* → http://127.0.0.1:3001/api/* ----
    location ^~ /chat/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        # 必须大于 UPLOAD_BODY_LIMIT_VIDEO (101 MiB)，让 413 由应用层按契约返回
        # （见 nginx-chat.conf 同处注释：图片/文件 11 MiB、视频 101 MiB）。
        client_max_body_size 102m;
        proxy_read_timeout 60s;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # ---- WebSocket：浏览器 wss://DOMAIN/chat/ws → ws://127.0.0.1:3001/ws ----
    location = /chat/ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 后端心跳 30s；留 2.5 个心跳周期，避免中间层先把长连接掐断。
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # ---- 静态资源：文件名带哈希，长缓存 ----
    location ^~ /chat/assets/ {
        root /opt/aitrance/current/web;
        try_files $uri =404;
        expires 7d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
    }

    # ---- SPA 回退 ----
    location = /chat {
        return 308 /chat/;
    }

    location ^~ /chat/ {
        root /opt/aitrance/current/web;
        index index.html;
        try_files $uri $uri/ /chat/index.html;
        # 文档级安全头（与 backend/src/app.ts 的 CONTENT_SECURITY_POLICY / PERMISSIONS_POLICY /
        # HSTS 常量逐字一致）；backend/test/deploy-headers.test.ts 会做逐字漂移检测。
        # HTTPS 形态下回退地址是 /chat/index.html（仍是文档），同一条头有效。
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self'; connect-src 'self' ws: wss:" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Cache-Control no-cache always;
    }
}
